plugins {
    id 'java'
}

allprojects {
    group = 'com.gabrieltoth'
    version = project.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.quiltmc.org/repository/release/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.parchmentmc.org' }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
        withSourcesJar()
        withJavadocJar()
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_${project.name}" }
        }
        manifest {
            attributes([
                'Specification-Title'     : project.mod_name,
                'Specification-Vendor'    : project.mod_author,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.mod_version,
                'Implementation-Vendor'   : project.mod_author,
            ])
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    processResources {
        inputs.property 'version', project.mod_version
        inputs.property 'minecraft_version', project.minecraft_version
        inputs.property 'loader_version', project.fabric_loader_version

        filesMatching(['fabric.mod.json', 'mods.toml', 'quilt.mod.json']) {
            expand 'version': project.mod_version,
                   'minecraft_version': project.minecraft_version,
                   'minecraft_version_range': project.minecraft_version_range,
                   'loader_version': project.fabric_loader_version,
                   'mod_id': project.mod_id,
                   'mod_name': project.mod_name,
                   'mod_description': project.mod_description,
                   'mod_author': project.mod_author
        }
    }
}
