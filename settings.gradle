pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.quiltmc.org/repository/release/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.neoforged.net/userdev/' }
        gradlePluginPortal()
    }
    plugins {
        id 'net.minecraftforge.gradle' version '6.0.29'
        id 'org.quiltmc.loom' version '1.7.4'
    }
}

rootProject.name = 'VelocityHUD'

include 'common'
include 'fabric'
include 'forge'
include 'quilt'
include 'neoforge'
